name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      FNOX_VERSION: v1.42.0
      AGE_VERSION: v1.3.2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: tools (fnox, age, lua5.4, keyutils)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq lua5.4 keyutils
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/jdx/fnox/releases/download/$FNOX_VERSION/fnox-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$HOME/.local/bin"
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz" | tar xz --strip-components=1 -C "$HOME/.local/bin" age/age age/age-keygen
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun test
